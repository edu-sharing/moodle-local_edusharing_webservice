stages:
  - build
  - release

variables:
  # Bundle build. When copying the build/release jobs to another plugin repo,
  # these two values are normally the only thing that needs to change.
  PLUGIN_DIR_NAME: "edusharing_webservice"
  PLUGIN_COMPONENT: "local_edusharing_webservice"
  # This repo's default branch is "master", unlike the other edu-sharing
  # plugin repos which use "main".
  RELEASE_BASE_BRANCH: "master"
  # Where the release asset link points. "package" uploads the zip to the
  # generic package registry (permanent URL, needs the Package Registry
  # enabled). Set to "artifact" to link this pipeline's job artifact instead.
  RELEASE_ASSET_SOURCE: "package"
  # Small image used by the build and release jobs. PHP is needed to read
  # $plugin->release out of version.php and to build the release payload.
  BUNDLE_IMAGE: "php:8.4-cli-alpine"

# This plugin has no automated test suite (internal, unreleased to the
# Moodle plugin directory), so there is no "test" stage - build/release run
# straight off a tag push.

# Builds the installable plugin zip. Replaces the manual buildRenderPlugin.sh:
# the archive has a single "edusharing_webservice/" root, matching the real
# component name (lang files, settings.php) rather than the legacy script's
# "edusharing" folder.
build_bundle:
  stage: build
  image: $BUNDLE_IMAGE
  services: []
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    # Full history, needed to prove the tag is on the release branch.
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git zip unzip
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - |
      set -eu

      VERSION="${CI_COMMIT_TAG#v}"
      ZIP_NAME="$PLUGIN_COMPONENT-$VERSION.zip"

      echo "== Verifying tag $CI_COMMIT_TAG is on $RELEASE_BASE_BRANCH =="
      git fetch --quiet origin "$RELEASE_BASE_BRANCH"
      git merge-base --is-ancestor "$CI_COMMIT_SHA" FETCH_HEAD \
        || { echo "Tag $CI_COMMIT_TAG does not point at a commit on $RELEASE_BASE_BRANCH - refusing to release."; exit 1; }

      echo "== Verifying tag matches \$plugin->release =="
      # version.php guards on MOODLE_INTERNAL and uses Moodle's MATURITY_*
      # constants, so those have to exist before it can be read outside Moodle.
      RELEASE=$(php -r '
        $constants = [
            "MOODLE_INTERNAL" => 1,
            "MATURITY_ALPHA"  => 50,
            "MATURITY_BETA"   => 100,
            "MATURITY_RC"     => 150,
            "MATURITY_STABLE" => 200,
            "ANY_VERSION"     => "any",
        ];
        foreach ($constants as $name => $value) {
            define($name, $value);
        }
        $plugin = new stdClass();
        require "version.php";
        echo $plugin->release;
      ')
      if [ "$RELEASE" != "$VERSION" ]; then
        echo "Tag $CI_COMMIT_TAG does not match \$plugin->release '$RELEASE' in version.php."
        echo "Bump version.php (release and version) or fix the tag, then retry."
        exit 1
      fi
      echo "version.php release: $RELEASE"

      echo "== Staging bundle =="
      STAGE="/tmp/bundle"
      rm -rf "$STAGE"
      mkdir -p "$STAGE/$PLUGIN_DIR_NAME"

      # Export the tracked tree at this commit instead of copying the working
      # directory. That keeps .git and any leftovers from a reused runner
      # workspace out of the bundle, and makes the content depend only on the tag.
      git archive --format=tar HEAD | tar -xf - -C "$STAGE/$PLUGIN_DIR_NAME"

      cd "$STAGE/$PLUGIN_DIR_NAME"

      # Tracked VCS / CI metadata that has no place in a release zip.
      rm -rf .gitignore .gitlab-ci.yml .gitmodules

      echo "== Verifying staged tree =="
      # RenderMoodleService.php is the core service class; an export that lost
      # it would install but be unable to render anything.
      if [ ! -f classes/RenderMoodleService.php ]; then
        echo "Staging produced no classes/RenderMoodleService.php."
        find . -maxdepth 2 2>&1 | head -40 || true
        exit 1
      fi
      echo "staged classes/: $(find classes -name '*.php' | wc -l) php files"

      echo "== Zipping =="
      cd "$STAGE"
      zip -q -r "$CI_PROJECT_DIR/$ZIP_NAME" "$PLUGIN_DIR_NAME"
      cd "$CI_PROJECT_DIR"

      echo "== Checking archive layout =="
      # Write the listing to a file and grep that, rather than piping into
      # "grep -q". GitLab runs job scripts with "set -o pipefail", and grep -q
      # exits on its first match, which kills unzip with SIGPIPE (141) - so a
      # piped check reports failure precisely when the pattern DOES match.
      LISTING="/tmp/archive-listing.txt"
      unzip -l "$ZIP_NAME" > "$LISTING"

      if ! grep -q " $PLUGIN_DIR_NAME/version.php\$" "$LISTING"; then
        echo "$ZIP_NAME has no $PLUGIN_DIR_NAME/version.php - wrong archive root?"
        exit 1
      fi
      if ! grep -q "$PLUGIN_DIR_NAME/classes/RenderMoodleService.php\$" "$LISTING"; then
        echo "$ZIP_NAME is missing classes/RenderMoodleService.php."
        grep -m 20 classes "$LISTING" || echo "(no classes entries at all)"
        exit 1
      fi
      if grep -qE "$PLUGIN_DIR_NAME/\.git" "$LISTING"; then
        echo "$ZIP_NAME still contains files that should have been stripped."
        grep -E "$PLUGIN_DIR_NAME/\.git" "$LISTING" || true
        exit 1
      fi
      cat "$LISTING"

      echo "== Preparing release notes =="
      # This repo has no CHANGELOG.md, so there is nothing to slice - fall
      # straight through to the generic description.
      if [ -f CHANGELOG.md ]; then
        awk -v tag="$VERSION" '
          $0 ~ "^## \\[" tag "\\]" { found = 1; next }
          found && /^## \[/ { exit }
          found { print }
        ' CHANGELOG.md > notes.md || true
      fi
      if [ ! -s notes.md ]; then
        echo "No CHANGELOG.md section for $VERSION, using a generic description."
        printf 'Release %s of %s.\n' "$VERSION" "$PLUGIN_COMPONENT" > notes.md
      fi

      PACKAGE_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PLUGIN_COMPONENT/$VERSION/$ZIP_NAME"

      # Which URL the release asset points at. "package" needs the Package
      # Registry enabled on the instance; "artifact" works everywhere but ties
      # the download to this job's artifact.
      if [ "$RELEASE_ASSET_SOURCE" = "artifact" ]; then
        ASSET_URL="$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/$ZIP_NAME?job=build_bundle"
        LINK_TYPE="other"
      else
        ASSET_URL="$PACKAGE_URL"
        LINK_TYPE="package"
      fi
      echo "Release asset ($RELEASE_ASSET_SOURCE): $ASSET_URL"

      # Build the Releases API payload here, where PHP is available to do the
      # JSON escaping of the changelog text.
      ZIP_NAME="$ZIP_NAME" ASSET_URL="$ASSET_URL" LINK_TYPE="$LINK_TYPE" php -r '
        $notes = trim((string) @file_get_contents("notes.md"));
        echo json_encode([
            "name"        => getenv("CI_COMMIT_TAG"),
            "tag_name"    => getenv("CI_COMMIT_TAG"),
            "description" => $notes,
            "assets"      => ["links" => [[
                "name"      => getenv("ZIP_NAME"),
                "url"       => getenv("ASSET_URL"),
                "link_type" => getenv("LINK_TYPE"),
            ]]],
        ], JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE);
      ' > release.json

      # Hand the computed names to the release job.
      {
        echo "ZIP_NAME=$ZIP_NAME"
        echo "PACKAGE_URL=$PACKAGE_URL"
      } > build.env

      echo "Built $ZIP_NAME"
  artifacts:
    name: "$PLUGIN_COMPONENT-$CI_COMMIT_TAG"
    paths:
      - "*.zip"
      - release.json
    # Never expire: with RELEASE_ASSET_SOURCE=artifact the release asset link
    # points here, and even in package mode this is a cheap second copy.
    expire_in: never
    reports:
      dotenv: build.env

# Uploads the zip to the project's generic package registry and creates the
# GitLab release for the tag, with the package linked as a release asset.
publish_release:
  stage: release
  image: $BUNDLE_IMAGE
  services: []
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache curl
  script:
    - |
      set -eu

      if [ "$RELEASE_ASSET_SOURCE" = "artifact" ]; then
        echo "== Skipping package upload (RELEASE_ASSET_SOURCE=artifact) =="
      else

      echo "== Uploading $ZIP_NAME to the package registry =="
      STATUS=$(curl --silent --output /tmp/upload-response.txt --write-out '%{http_code}' \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file "$ZIP_NAME" \
        "$PACKAGE_URL")
      echo "HTTP $STATUS"
      cat /tmp/upload-response.txt 2>/dev/null || true
      echo
      case "$STATUS" in
        20*)
          ;;
        403|404)
          echo "The generic package registry rejected the upload (HTTP $STATUS)."
          echo "Most likely the Package Registry is disabled for this project or instance."
          echo "Check:   Settings > General > Visibility, project features, permissions > Packages"
          echo "Verify:  curl --header \"PRIVATE-TOKEN: <token>\" \"$CI_API_V4_URL/projects/$CI_PROJECT_ID\" | grep -o '\"packages_enabled\":[^,]*'"
          echo "If it cannot be enabled, set RELEASE_ASSET_SOURCE: \"artifact\" in .gitlab-ci.yml to link the job artifact instead."
          exit 1
          ;;
        *)
          echo "Unexpected response uploading the package (HTTP $STATUS)."
          exit 1
          ;;
      esac

      fi

      RELEASES_API="$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"

      # Creating a release that already exists fails with 409, which turns a
      # harmless job retry into a red pipeline. Check first.
      STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$RELEASES_API/$CI_COMMIT_TAG")
      if [ "$STATUS" = "200" ]; then
        echo "Release $CI_COMMIT_TAG already exists; the package was re-uploaded but the release is left untouched."
        echo "Delete the release under $CI_PROJECT_URL/-/releases if it needs to be recreated."
        exit 0
      fi

      echo "== Creating release $CI_COMMIT_TAG =="
      curl --silent --show-error --fail-with-body \
        --request POST \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --header "Content-Type: application/json" \
        --data @release.json \
        "$RELEASES_API"
      echo

      echo "Release ready: $CI_PROJECT_URL/-/releases/$CI_COMMIT_TAG"